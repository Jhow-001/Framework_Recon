###############################################
# Recon Framework V2 - Configuration
###############################################
FRAMEWORK_NAME="Recon Framework"
FRAMEWORK_VERSION="2.0.0"

# Paralelismo de módulos (0 = auto: min(nproc*2, 8) no scheduler)
MAX_PARALLEL=6
MEMORY_LIMIT_PERCENT=80
MEMORY_MIN_FREE_PERCENT=15

TIMEOUT_GLOBAL=43200
TIMEOUT_MODULE=3600
TIMEOUT_TOOL=900
TIMEOUT_DNS=1800
DNS_MAX_HOSTS=8000

RETRY_MAX=1
RETRY_BASE_DELAY=5

# Perfil: fast | standard | deep  (run.sh pode sobrescrever)
: "${PROFILE:=standard}"

# Caps pós-crawling (module_finalize)
CRAWL_MAX_JS=400
CRAWL_MAX_API=300
CRAWL_MAX_PARAMS=400
CRAWL_MAX_JWT=150
CRAWL_MAX_FORMS=150
CRAWL_MAX_VULN=400

RESOLVERS="${CONFIG_DIR}/resolvers.txt"
DNS_THREADS=100
DNS_RETRIES=2
DNS_TIMEOUT=5

HTTP_THREADS=100
HTTP_TIMEOUT=10
HTTP_RETRIES=2

RATE_LIMIT=150

ENABLE_LOG=true
LOG_LEVEL="INFO"

FUZZ_WORDLIST="${ROOT_DIR}/wordlists/paths/common.txt"
FUZZ_MAX_URLS=20
FUZZ_THREADS=15
FUZZ_RATE=25

DNSX_BIN="dnsx"
SUBFINDER_BIN="subfinder"
ASSETFINDER_BIN="assetfinder"
FINDOMAIN_BIN="findomain"
CHAOS_BIN="chaos"
GITHUB_SUBDOMAINS_BIN="github-subdomains"
CROBAT_BIN="crobat"
PUREDNS_BIN="puredns"
HTTPX_BIN="httpx"
NAABU_BIN="naabu"
NMAP_BIN="nmap"
NUCLEI_BIN="nuclei"
FFUF_BIN="ffuf"
FEROXBUSTER_BIN="feroxbuster"
KATANA_BIN="katana"
GAU_BIN="gau"
GOWITNESS_BIN="gowitness"
WAFW00F_BIN="wafw00f"

USER_AGENT="ReconFramework/2.0"
GETJS_BIN="getJS"
SUBJS_BIN="subjs"
XNLINKFINDER_BIN="xnLinkFinder"
JSLUICE_BIN="jsluice"
JS_MAX_URLS=150
JS_XN_TIMEOUT=300

# =============================================================================
# Pipeline V2 — dependência = coluna ENTRADA (artefato)
# FASE = agrupamento opcional de paralelismo no scheduler
# MÓDULO = pasta modules/<nome>/<nome>.sh
# =============================================================================

# --- Discovery (DOMAIN) ---
1 | subdomains | modules/subdomains/subdomains.sh | DOMAIN | subdomains.txt
1 | osint | modules/osint/osint.sh | DOMAIN | osint.txt
1 | cloud | modules/cloud/cloud.sh | DOMAIN | cloud.txt

# --- Pós-discovery (paralelo entre si; cada um espera só o seu input) ---
2 | dns_resolution | modules/dns_resolution/dns_resolution.sh | subdomains.txt | dns.txt
2 | osint_validation | modules/osint_validation/osint_validation.sh | osint.txt | validated_secrets.txt

# --- Enumeration a partir de dns.txt ---
3 | http_probe | modules/http_probe/http_probe.sh | dns.txt | http.txt
3 | ports_scan | modules/ports_scan/ports_scan.sh | dns.txt | ports.txt

# --- A partir de http.txt ---
4 | waf_detection | modules/waf_detection/waf_detection.sh | http.txt | waf.txt
4 | screenshots | modules/screenshots/screenshots.sh | http.txt | screenshots.txt
4 | exposure_assessment | modules/exposure_assessment/exposure_assessment.sh | http.txt | exposure.txt
4 | crawling | modules/crawling/crawling.sh | http.txt | crawling.txt
4 | fuzzing | modules/fuzzing/fuzzing.sh | http.txt | fuzzing.txt

# --- Artefatos classificados do crawling ---
5 | javascript | modules/javascript/javascript.sh | js.txt | javascript.txt
5 | api | modules/api/api.sh | api_endpoints.txt | api.txt
5 | access_control | modules/access_control/access_control.sh | api_endpoints.txt | access_control.txt
5 | jwt_analysis | modules/jwt_analysis/jwt_analysis.sh | jwt_candidates.txt | jwt_analysis.txt

6 | vulnerability | modules/vulnerability/vulnerability.sh | vuln_targets.txt | vulnerability.txt

# 7 reporting = run.sh → modules/reporting/reporting.sh

# --- Reporting: preferir core/reporting no run.sh se não houver módulo ---
# 7 | reporting | modules/reporting/reporting.sh | ALL | report.json
